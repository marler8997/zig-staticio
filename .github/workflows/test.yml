name: Test
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: windows-11-arm
          - os: macos-latest
          - os: ubuntu-latest
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig build test --summary all
      - run: zig build test --summary all
        working-directory: patch
      - name: patch is up to date
        run: |
          zig build update-patch
          git diff --exit-code
